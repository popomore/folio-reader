name: Folio CI
on:
  pull_request:
  push:
    branches: [main, release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folio-ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  release-tools:
    name: Release automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test release planning, provenance, and recovery
        run: |
          npm test
          python3 -m unittest discover -s scripts/tests -v
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - name: Check formatting, lint, and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo test --locked -p folio-core --no-default-features
          cargo test --locked -p folio-bridge --no-default-features
  macos:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build and verify application
        run: |
          xcodebuild -version
          rustup show active-toolchain
          node --version
          app="$(scripts/build-macos)"
          info="$app/Contents/Info.plist"
          preview="$app/Contents/PlugIns/FolioQuickLook.appex/Contents/Info.plist"
          test "${app##*/}" = Folio.app
          test "$(plutil -extract CFBundleDisplayName raw "$info")" = Folio
          test "$(plutil -extract CFBundleDisplayName raw "$preview")" = Folio
          test "$(plutil -extract CFBundleIdentifier raw "$preview")" = org.popomore.folio.preview.quicklook
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$preview")" = com.apple.quicklook.preview
          scripts/check-quicklook "$app"
          scripts/check-model-preview "$app"
          scripts/check-archive-preview "$app"
          xcrun swiftc -swift-version 6 -warnings-as-errors \
            apps/macos/Sources/WorkspaceLayout.swift apps/macos/LayoutTests/WorkspaceLayoutCheck.swift \
            -o "$RUNNER_TEMP/folio-layout-check"
          "$RUNNER_TEMP/folio-layout-check"
          xcrun swiftc -swift-version 6 -warnings-as-errors -parse-as-library \
            apps/macos/Sources/QuickLookRegistry.swift apps/macos/QuickLookTests/RegistrationCheck.swift \
            -o "$RUNNER_TEMP/folio-registration-check"
          "$RUNNER_TEMP/folio-registration-check"
          xcrun swiftc -swift-version 6 -warnings-as-errors -parse-as-library \
            apps/macos/Sources/{PrivateUpdateChannel,LocalUpdateFeed}.swift apps/macos/UpdateTests/PrivateUpdateCheck.swift \
            -o "$RUNNER_TEMP/folio-private-update-check"
          "$RUNNER_TEMP/folio-private-update-check"
          xcrun swiftc -swift-version 6 -warnings-as-errors -parse-as-library \
            apps/macos/CLI/Installation.swift apps/macos/CLITests/InstallCheck.swift \
            -o "$RUNNER_TEMP/folio-install-check"
          "$RUNNER_TEMP/folio-install-check"
          cli="$app/Contents/Helpers/folio"
          "$cli" --help
          test "$("$cli" --version)" = "$(plutil -extract CFBundleShortVersionString raw "$info")"
          status=0
          "$cli" --unknown || status=$?
          test "$status" -eq 2
          status=0
          "$cli" "$app/no-such-file" || status=$?
          test "$status" -eq 1
          status=0
          "$cli" --new-instance --version || status=$?
          test "$status" -eq 2
          status=0
          reuse_error=$("$cli" --reuse --version 2>&1) || status=$?
          test "$status" -eq 2
          test "$reuse_error" = "folio: --reuse only applies to opening or previewing files."
          cargo test --locked --workspace
          npm test --prefix renderer
          scripts/check-consumer
  ios:
    name: iOS
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Compile for simulator and device
        run: |
          scripts/build-ios simulator
          scripts/build-ios device
      - name: Verify coordinated files and the native reading flows
        env:
          FOLIO_IOS_RESULT_BUNDLE: ${{ runner.temp }}/Folio-iOS-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
        run: scripts/check-ios
      - name: Retain iOS test results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folio-ios-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Folio-iOS-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
          if-no-files-found: ignore
          retention-days: 7
  gate:
    name: CI gate
    needs: [rust, macos, ios, release-tools]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ci-gate.yml
    with:
      rust: ${{ needs.rust.result }}
      macos: ${{ needs.macos.result }}
      ios: ${{ needs.ios.result }}
      release-tools: ${{ needs.release-tools.result }}
  tag:
    name: Tag macOS Preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag the tested commit and dispatch the preview release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: scripts/tag-macos-preview
