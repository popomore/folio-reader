name: Folio CI gate

on:
  workflow_call:
    inputs:
      rust:
        required: true
        type: string
      macos:
        required: true
        type: string
      release-tools:
        required: true
        type: string

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Rust, macOS, and release checks to pass
        env:
          RUST_RESULT: ${{ inputs.rust }}
          MACOS_RESULT: ${{ inputs.macos }}
          RELEASE_RESULT: ${{ inputs.release-tools }}
        run: |
          test "$RUST_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$RELEASE_RESULT" = success
