name: Release Folio for macOS
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to verify. Leave empty when dispatching on a tag.
        type: string
      publish-preview:
        description: Publish the verified preview tag. Used by Folio CI.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') && format('folio-macos-preview-{0}', github.ref_name) || 'folio-macos-release' }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      version: ${{ steps.source.outputs.version }}
      channel: ${{ steps.source.outputs.channel }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release tag and source
        id: source
        env:
          FOLIO_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: scripts/validate-release-source "$FOLIO_TAG" >> "$GITHUB_OUTPUT"
      - name: Restrict publication dispatch to the selected preview tag
        if: inputs.publish-preview
        env:
          CHANNEL: ${{ steps.source.outputs.channel }}
        run: test "$GITHUB_REF_TYPE" = tag && test "$CHANNEL" = timestamp
  verification:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish-preview
    needs: source
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - if: needs.source.outputs.channel == 'stable'
        run: scripts/prepare-update-qa
      - if: needs.source.outputs.channel == 'timestamp'
        name: Verify preview packaging with a temporary key
        env:
          FOLIO_RELEASE_REPOSITORY: ${{ github.repository }}
          FOLIO_TAG: ${{ needs.source.outputs.tag }}
          FOLIO_VERSION: ${{ needs.source.outputs.version }}
        run: |
          seed=$(xcrun swift scripts/macos-update-key.swift generate </dev/null)
          echo "::add-mask::$seed"
          FOLIO_UPDATE_PUBLIC_KEY=$(printf '%s\n' "$seed" | xcrun swift scripts/macos-update-key.swift)
          export FOLIO_UPDATE_PUBLIC_KEY FOLIO_UPDATE_PRIVATE_KEY="$seed"
          scripts/package-macos-preview
  release:
    if: ${{ !github.event.repository.private && (github.event_name == 'push' || inputs.publish-preview) }}
    needs: source
    environment: ${{ needs.source.outputs.channel == 'timestamp' && 'folio-macos-preview' || 'folio-macos-release' }}
    runs-on: xcode-27
    timeout-minutes: 80
    permissions:
      actions: read
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      FOLIO_RELEASE_REPOSITORY: ${{ github.repository }}
      FOLIO_VERSION: ${{ needs.source.outputs.version }}
      FOLIO_TAG: ${{ needs.source.outputs.tag }}
      FOLIO_RELEASE_CHANNEL: ${{ needs.source.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check public distribution and select assets
        id: distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Configure the distribution token}"
          [[ "$FOLIO_RELEASE_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]
          test "$FOLIO_RELEASE_REPOSITORY" = "$GITHUB_REPOSITORY"
          gh api "repos/$FOLIO_RELEASE_REPOSITORY" | jq -e '.private == false'
          if [[ "$FOLIO_RELEASE_CHANNEL" == timestamp ]]; then
            stem="dist/Folio-$FOLIO_VERSION-arm64"
            notes=".release/preview-notes.txt"
            files=$(jq -cn --arg stem "$stem" '[$stem+".zip", $stem+".dmg", $stem+".dmg.sha256", "dist/appcast.xml"]')
          else
            stem="dist/Folio-$FOLIO_VERSION"
            notes=".release/notes.txt"
            files=$(jq -cn --arg stem "$stem" '[$stem+".zip", $stem+".dmg", "dist/appcast.xml"]')
          fi
          {
            printf 'notes=%s\npaths<<END_PATHS\n' "$notes"
            jq -r '.[]' <<< "$files"
            printf 'END_PATHS\n'
          } >> "$GITHUB_OUTPUT"
      - name: Inspect existing release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/stage-macos-release inspect >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.release-id != ''
        name: Resume verified distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.published.outputs.release-id }}
        run: scripts/publish-macos-channel "$FOLIO_VERSION" "$RELEASE_ID" resume
      - if: steps.published.outputs.release-id == ''
        id: signed
        name: Look for signed packages from this run
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_DRAFT: ${{ steps.published.outputs.draft }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --method GET -f name=folio-signed-packages)
          count=$(jq -er '.total_count' <<< "$artifacts")
          case "$count" in
            0)
              if [[ "$HAS_DRAFT" == true ]]; then
                echo "::error::The incomplete release has no retained signed packages in this run. Use the original run and its packages."
                exit 1
              fi
              ;;
            1)
              id=$(jq -er '.artifacts[0] | select(.name == "folio-signed-packages" and .expired == false) | .id | select(type == "number")' <<< "$artifacts") || {
                echo "::error::The retained signed packages have expired or cannot be identified."
                exit 1
              }
              printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::More than one signed package artifact matches this run."
              exit 1
              ;;
          esac
      - if: steps.signed.outputs.id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.signed.outputs.id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: dist
      - if: steps.published.outputs.release-id == '' && steps.signed.outputs.id == ''
        name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - if: steps.published.outputs.release-id == '' && steps.signed.outputs.id == '' && needs.source.outputs.channel == 'timestamp'
        name: Build ad hoc preview and sign the Sparkle update
        env:
          FOLIO_UPDATE_PRIVATE_KEY: ${{ secrets.FOLIO_UPDATE_PRIVATE_KEY }}
          FOLIO_UPDATE_PUBLIC_KEY: ${{ vars.FOLIO_UPDATE_PUBLIC_KEY }}
        run: scripts/package-macos-preview
      - if: steps.published.outputs.release-id == '' && steps.signed.outputs.id == '' && needs.source.outputs.channel == 'stable'
        name: Import Developer ID and build notarized packages
        env:
          FOLIO_APPLE_CERTIFICATE: ${{ secrets.FOLIO_APPLE_CERTIFICATE }}
          FOLIO_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.FOLIO_APPLE_CERTIFICATE_PASSWORD }}
          FOLIO_APPLE_NOTARY_KEY: ${{ secrets.FOLIO_APPLE_NOTARY_KEY }}
          FOLIO_APPLE_NOTARY_KEY_ID: ${{ secrets.FOLIO_APPLE_NOTARY_KEY_ID }}
          FOLIO_APPLE_NOTARY_ISSUER: ${{ secrets.FOLIO_APPLE_NOTARY_ISSUER }}
          FOLIO_UPDATE_PRIVATE_KEY: ${{ secrets.FOLIO_UPDATE_PRIVATE_KEY }}
          FOLIO_UPDATE_PUBLIC_KEY: ${{ vars.FOLIO_UPDATE_PUBLIC_KEY }}
        run: bash scripts/sign-macos-release
      - if: steps.published.outputs.release-id == '' && steps.signed.outputs.id == ''
        name: Retain the exact signed packages before staging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folio-signed-packages
          path: ${{ steps.distribution.outputs.paths }}
          if-no-files-found: error
          compression-level: 0
      - if: steps.published.outputs.release-id == ''
        name: Stage signed release assets
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATHS: ${{ steps.distribution.outputs.paths }}
          RELEASE_NOTES: ${{ steps.distribution.outputs.notes }}
        run: |
          paths=()
          while IFS= read -r path; do paths+=("$path"); done <<< "$PACKAGE_PATHS"
          scripts/stage-macos-release stage "$RELEASE_NOTES" "${paths[@]}" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.release-id == ''
        name: Verify public downloads and publish the selected channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.stage.outputs.release-id }}
        run: scripts/publish-macos-channel "$FOLIO_VERSION" "$RELEASE_ID"
